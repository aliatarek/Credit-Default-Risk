name: Build Check

# When this workflow runs: on every push to main, and on every pull request
# targeting main. This is the trigger — no push, no run.
on:
  push:
    branches: [ ahmed ]
  pull_request:
    branches: [ ahmed ]

jobs:
  build-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build FastAPI image
        run: docker build -f dockerfile.api -t credit-risk-api .

      # Actually start the container and hit /predict with a real payload,
      # instead of just confirming the image builds.
      - name: Run container
        run: docker run -d -p 8000:8000 --name credit-api-test credit-risk-api

      - name: Set up Python for the test script
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install requests pandas

      - name: Run API smoke test
        run: python test_api.py

      # Always print logs and clean up, even if the test above failed —
      # this makes a failure much easier to debug from the Actions tab.
      - name: Show container logs (on failure)
        if: failure()
        run: docker logs credit-api-test

      - name: Stop container
        if: always()
        run: docker rm -f credit-api-test

  build-streamlit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Streamlit image
        run: docker build -f dockerfile.streamlit -t credit-risk-streamlit .